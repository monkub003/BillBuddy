services:
  - type: web
    name: billbuddy-api
    runtime: node
    region: singapore
    plan: free
    rootDir: functions
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 8080
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false

  - type: web
    name: billbuddy-web
    runtime: static
    region: singapore
    plan: free
    rootDir: billbuddy
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
