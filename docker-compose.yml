services:
  firebase-emulators:
    image: node:18-slim
    working_dir: /app
    volumes:
      - .:/app
      - firebase-cache:/root/.cache/firebase
    ports:
      - "4000:4000"   # Emulator Suite UI
      - "8081:8081"   # Firestore
      - "9199:9199"   # Firebase Storage
      - "4400:4400"   # Emulator Hub
    environment:
      - FIREBASE_PROJECT_ID=billbuddy-dev
      - GCLOUD_PROJECT=billbuddy-dev
    command: >
      bash -c "
        apt-get update && apt-get install -y default-jre-headless curl &&
        npm install -g firebase-tools &&
        cd functions && npm install && cd .. &&
        firebase emulators:start --project billbuddy-dev --only firestore,storage
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  api:
    image: node:18-slim
    working_dir: /app/functions
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FIREBASE_PROJECT_ID=billbuddy-dev
      - JWT_SECRET=billbuddy-dev-secret-change-in-production
    command: >
      bash -c "
        npm install &&
        npm run build &&
        node dist/index.js
      "
    depends_on:
      firebase-emulators:
        condition: service_healthy

volumes:
  firebase-cache:
